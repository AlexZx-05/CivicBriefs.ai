name: Daily Capsule Dispatch

on:
  schedule:
    # 06:05 Asia/Kolkata = 00:35 UTC
    - cron: "35 0 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger capsule dispatch on Render
        env:
          CAPSULE_TRIGGER_URL: ${{ secrets.CAPSULE_TRIGGER_URL }}
          CAPSULE_DISPATCH_TOKEN: ${{ secrets.CAPSULE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$CAPSULE_TRIGGER_URL" ] || [ -z "$CAPSULE_DISPATCH_TOKEN" ]; then
            echo "Missing required GitHub secrets."
            exit 1
          fi
          if [[ "$CAPSULE_TRIGGER_URL" != *"/internal/capsule/dispatch" ]]; then
            echo "CAPSULE_TRIGGER_URL should end with /internal/capsule/dispatch"
            echo "Current value appears to be misconfigured."
            exit 1
          fi

          echo "Triggering capsule dispatch endpoint..."
          response_body_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --max-time 600 \
            -X POST "$CAPSULE_TRIGGER_URL" \
            -H "Content-Type: application/json" \
            -H "X-Dispatch-Token: $CAPSULE_DISPATCH_TOKEN" \
            -d "{}" \
            --output "$response_body_file" \
            --write-out "%{http_code}")"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Dispatch failed with HTTP $http_code"
            echo "Response body:"
            cat "$response_body_file"
            exit 1
          fi

          echo "Dispatch succeeded (HTTP $http_code)"
          cat "$response_body_file"
